name: Check Pull Request
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n install build start stop open data-service-run
      - name: ShellCheck
        run: shellcheck install build start stop open data-service-run
